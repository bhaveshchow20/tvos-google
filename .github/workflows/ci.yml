name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup-tools:
    name: TV setup tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d4954a3c4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test ADB and theme setup
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/python -m pip install -q -r tools/requirements.txt
          tools/venv/bin/python -m unittest discover -s tests -p 'test_native_adb.py' -v
          for test in test_theme_{config_root,exit_status,one_argument,paths,push_ownership,restart}.py; do
            tools/venv/bin/python -m unittest discover -s tests -p "$test" -v
          done

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Unit tests, lint and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 786432 || { echo "APK is over 768 KB (tvos27 fork: Inter font, TMDB and the tvOS screens; upstream gates 576 KB); keep it small"; exit 1; }
